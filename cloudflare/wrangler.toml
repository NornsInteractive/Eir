name = "eir"
main = "_worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom Domain
routes = [
  { pattern = "eir.krm.cc.cd", custom_domain = true }
]

# Static assets from Flutter Web build
[assets]
directory = "../build/web"
binding = "ASSETS"

# Durable Object for global edge room signaling
[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "SignalingCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingCoordinator"]
