name = "eir-signaling"
main = "_worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Static assets from Flutter Web build
[assets]
directory = "../build/web"
binding = "ASSETS"

# Durable Object for global edge room signaling
[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "SignalingCoordinator" }
]

[[migrations]]
tag = "v1"
new_classes = ["SignalingCoordinator"]
